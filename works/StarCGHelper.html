<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>CrossGate 日任/製造 計算工具</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
html,
body {
    height: 100%;
    margin: 0;
    font: 16px '微軟正黑體', arial;
    overflow: hidden;
}
.wrapper {
    height: 100%;
}
header {
    height: 40px;
    background-color: #888;
    color: #eee;
    line-height: 40px;
    text-align: center;
}
header p {
    margin: 0;
}
header p.time {
    position: absolute;
    top: 0;
    left: 90%;
}
header p.year {
    display: none;
}
main {
    width: 900px;
    height: calc(100% - 64px);
    /* margin: 0 0 0 auto; */
    margin: 0 auto;
    padding: 20px 10px;
    box-sizing: border-box;
}
.applyBox {
    float: left;
    position: relative;
    width: 255px;
    height: 100%;
    margin-right: 50px;
}
.resultBox {
    float: left;
    position: relative;
    width: 370px;
    height: calc(100% - 104px);
}
.resultBox2 {
    float: left;
    position: relative;
    width: 190px;
    height: calc(100% - 169px);
    margin: 64px 15px 0 0;
    padding: 4px;
    box-sizing: border-box;
    border: 1px solid #222;
    border-radius: 4px;
    box-shadow: 0 0 8px #888 inset;
}
.resultBox2 table {
    width: 100%;
}
footer {
    height: 24px;
    background-color: #888;
    color: #eee;
    font-size: 13px;
    line-height: 24px;
    text-align: center;
}
.scrollbar_beauty {
    scrollbar-width: thin;
    scrollbar-color: #bbb transparent;
}
.scrollbar_beauty::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
.scrollbar_beauty::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background-color: #bbb;
}
.scrollbar_beauty::-webkit-scrollbar-corner {
    background: transparent;
}
.selectList_group {
    height: 24px;
    margin: 4px 0;
    border-top: 1px solid #222;
    border-bottom: 1px solid #222;
    font-weight: bold;
    text-align: center;
}
.selectList_item {
    height: 24px;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
}
.selectList_item+.selectList_item {
    margin-top: 4px;
}
.selectList_item:hover {
    background-color: #ffd79e;
}
.selectList_item.active {
    background-color: #f7af4b;
}
.peopleHeader {
    position: relative;
    height: 24px;
    margin-bottom: 8px;
    border-radius: 8px;
    background-color: #ccc;
}
.peopleHeader_btn,
.peopleHeader_btn2 {
    position: absolute;
    top: 3px;
    left: 10px;
    padding: 0 4px;
    border-radius: 8px;
    background-color: #eee;
    font-size: 14px;
    line-height: 18px;
    cursor: pointer;
}
.peopleHeader_btn2 {
    left: 55px;
}
.peopleHeader_selectCount {
    position: absolute;
    top: 3px;
    right: 10px;
    padding: 0 4px;
    border-radius: 8px;
    background-color: #eee;
    line-height: 18px;
}
.peopleHeader span {
    margin: 0 4px;
    font-size: 14px;
}
.peopleHeader span.count {
    font-weight: bold;
    font-size: 16px;
}
.selectList1_search {
    position: relative;
    margin-bottom: 8px;
}
.selectList1_search input {
    display: block;
    width: 75%;
    margin: 0 auto;
    padding: 2px 15% 2px 10px;
    border: 1px solid #222;
    border-radius: 14px;
    box-shadow: 0 0 4px #888;
    font-size: 16px;
    outline: 0;
}
.selectList1_search i {
    position: absolute;
    top: 3px;
    right: 8%;
}
.selectList1_search .selectCount {
    position: absolute;
    top: 0;
    right: 0;
}
.selectList_optionBtn {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    height: 110px;
    overflow: hidden;
}
.selectList_optionBtn_list {
    position: absolute;
    top: -24px;
    width: 150px;
    border-radius: 0 0 4px 4px;
    background-color: #aaa;
    transition: top .3s;
}
.selectList_optionBtn_list.active {
    top: 0;
}
.selectList_optionBtn_item {
    position: relative;
    height: 24px;
    color: #f2f2f2;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
}
.selectList_optionBtn_item:hover {
    color: #fff569;
}
.selectList_optionBtn_btn {
    content: '';
    position: absolute;
    left: 8px;
    bottom: -14px;
    width: 30px;
    height: 30px;
    border-radius: 15px;
    background-color: #aaa;
    cursor: pointer;
}
.selectList_optionBtn_btn::before {
    content: '\f107';
    position: absolute;
    top: 9px;
    left: 7px;
    color: #f2f2f2;
    font-size: 24px;
    font-family: 'FontAwesome';
    cursor: pointer;
    transition: transform .3s;
}
.selectList_optionBtn_list.active .selectList_optionBtn_btn::before {
    transform: rotate(180deg);
}
.applyBox_content {
    position: absolute;
    top: 25%;
    left: 0;
    width: 100%;
    height: 360px;
}
.applyBox_content span {
    display: inline-block;
    margin-right: 8px;
    line-height: 20px;
}
.applyBox_content select {
    display: inline-block;
    height: 28px;
    padding: 0 2px;
    box-sizing: border-box;
    font: 16px '微軟正黑體', arial;
}
.applyBox_content input {
    display: inline-block;
    height: 28px;
    margin-left: 4px;
    padding: 0 2px;
    box-sizing: border-box;
    font: 16px '微軟正黑體', arial;
}
.applyBox_quick_text1,
.applyBox_quick_text2 {
    width: 175px;
}
.applyBox_text1,
.applyBox_text2,
.applyBox_text3 {
    width: 207px;
}
.applyBox_btn {
    position: absolute;
    left: 50px;
    bottom: 0;
    width: 100px;
    height: 30px;
    box-shadow: 0 3px 0 0 rgba(0, 0, 0, .2);
    border-bottom: 4px solid #575757;
    border-radius: 5px;
    background: linear-gradient(to bottom, #9e9e9e 0%,#686868 100%);
    color: #fbfbfb;
    line-height: 30px;
    font-weight: 600;
    text-shadow: 1px 1px 1px rgba(0, 0, 0, .4);
    text-indent: 16px;
    cursor: not-allowed;
    -webkit-user-select: none;
       -moz-user-select: none;
        -ms-user-select: none;
            user-select: none;
}
.applyBox_btn.active {
    border-bottom: 4px solid #2b8bc6;
    background: linear-gradient(to bottom, #4eb5e5 0%,#389ed5 100%);
    cursor: pointer;
}
.applyBox_btn.active:active {
    box-shadow: 0 2px 0 0 rgba(0,0,0,.2);
    background: linear-gradient(to bottom, #46a2cd 0%,#2f80ab 100%);
}
.applyBox_btn::after {
    content: '';
    position: absolute;
    top: 1px;
    right: 0;
    border-top: 15px solid #535353;
    border-left: 8px solid transparent;
    border-right: 15px solid #535353;
    border-bottom: 15px solid #535353;
    border-radius: 0 5px 5px 0;
    opacity: 0.6;
}
.resultBox_tab {
    position: absolute;
    top: 33px;
    left: 16px;
}
.resultBox_tab>div {
    float: left;
    width: 60px;
    height: 30px;
    border: 1px solid #222;
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    background-color: #f1cea0;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
}
.resultBox_tab>div+div {
    border-left: 0;
}
.resultBox_tab>div.active {
    background-color: #e7b677;
    cursor: auto;
}
.resultBox_textarea {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: calc(100% - 65px);
    margin-top: 64px;
    padding: 20px;
    box-sizing: border-box;
    border: 1px solid #222;
    border-radius: 4px;
    box-shadow: 0 0 8px #888 inset;
    background-color: #fff;
    overflow: auto;
    z-index: 2;
}
.resultBox_textarea td {
    padding: 2px 4px;
    text-align: center;
}
.resultBox_textarea td.remove {
    min-width: 30px;
}
.btn {
    position: absolute;
    right: 4px;
    bottom: 4px;
    padding: 4px 16px;
    border: none;
    border-radius: 8px;
    background-color: #ec971f;
    color: #f2f2f2;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
}
.resultBox_btn_remove {
    display: none;
    right: 4px;
    bottom: -40px;
}
.resultBox_btn_remove.active {
    display: block;
}
tr.gray {
    color: #ccc;
}
</style>
</head>
<body>
<div class="wrapper">
    <header>
        <p>CrossGate 日任/製造 計算工具</p>
    </header>
    <main>
        <div class="applyBox">
            <div class="applyBox_content">
                <p>
                    <span>類型:</span>
                    <select class="applyBox_text1">
                        <option>請選擇</option>
                    </select>
                </p>
                <p>
                    <span>名稱:</span>
                    <select class="applyBox_text2">
                        <option>請選擇</option>
                    </select>
                </p>
                <p><span>數量:</span><input class="applyBox_text3" type="number" min="1" value="1" /></p>
                <div class="applyBox_btn">Apply</div>
            </div>
        </div>
        <div class="resultBox2">
            <table></table>
        </div>
        <div class="resultBox">
            <div class="selectList_optionBtn">
                <div class="selectList_optionBtn_list">
                    <div class="selectList_optionBtn_btn"></div>
                    <!-- <div class="selectList_optionBtn_item">刪除項目</div> -->
                    <div class="selectList_optionBtn_item">清空資料</div>
                </div>
            </div>
            <div class="resultBox_tab"></div>
            <div class="resultBox_textarea scrollbar_beauty">
                <table></table>
            </div>
            <div class="btn resultBox_btn_remove">刪除</div>
        </div>
    </main>
    <footer>Version: 0.87.2; Support: Chrome, Firefox, Safari, Edge, Internet Explorer 9+; Copyright © 2025</footer>
</div>

$(function () {
    // get data
    var data = [];

    var currentValue = {
        data,
        resultMode: 'sum',
        resultRemoveMode: false,
    };

    // common func
    function addZero (time) {
        return time < 10 ? '0' + time : time;
    }

    function createResult() {
        var result = '';
        var result2 = '';
        var time = $('.time span').html();
        var allMaterial = {};
        currentValue.data.forEach(function (d) {
            if (d.ignore) return;
            if (d.type === '其他') {
                if (!allMaterial[d.name]) {
                    allMaterial[d.name] = 0;
                }
                allMaterial[d.name] += +d.number;
            } else {
                if (!constants.type.find(function (o) {
                    return o.type === d.type;
                }).data.find(function (t) {
                    return t.name === d.name;
                })) {
                    console.log(d.name);
                    allMaterial[d.name] = '?';
                } else {
                    constants.type.find(function (o) {
                        return o.type === d.type;
                    }).data.find(function (t) {
                        return t.name === d.name;
                    }).material.forEach(function (dd) {
                        if (!allMaterial[dd.name]) {
                            allMaterial[dd.name] = 0; 
                        }
                        allMaterial[dd.name] += dd.number * d.number;
                    });
                }
            }
        });
        allMaterial = Object.keys(allMaterial).map(function (key) {
            return {
                name: key,
                number: allMaterial[key],
            };
        });
        var arr = Object.keys(constants.material);
        allMaterial.sort(function (a, b) {
            return arr.indexOf(a.name) - arr.indexOf(b.name);
        });
        result += '<tr><td>材料名稱</td><td>數量</td></tr>';
        allMaterial.forEach(function (m) {
            var color = '#000';
            var special;
            if (constants.material[m.name]) {
                switch (constants.material[m.name].type) {
                    case '礦':
                        color = '#c44f39';
                        break;
                    case '礦2':
                        color = '#c44f39';
                        special = true;
                        break;
                    case '木':
                        color = '#1cd422';
                        break;
                    case '花':
                        color = '#f28b05';
                        break;
                    case '獵':
                        color = '#f7c728';
                        break;
                    case '布':
                        color = '#d92588';
                        break;
                }
            }
            result += '<tr style="color: ' + color + '"><td>' + (special ? '* ' : '') + (constants.material[m.name] ? constants.material[m.name].name : m.name) + '</td><td>' + m.number + '</td></tr>';
        });
        $('.resultBox_textarea table').html(result);
    }
    createResult();

    function ignore() {
        var ignoreSelect = $(this).index();
        console.log(11839, ignoreSelect);
        currentValue.data[ignoreSelect].ignore = !currentValue.data[ignoreSelect].ignore;
        $('.resultBox2 tr').each(function (i) {
            $(this).attr('class', currentValue.data[i].ignore ? 'gray' : '');
        });
        createResult();
    }
    $('.resultBox2 table').on('click', 'tr', ignore);

    // normal select
    constants.type.forEach(function (d) {
        $('.applyBox_text1').append($('<option>', {
            text: d.type,
        }));
    });

    $('.applyBox_text1').on('change', function () {
        $('.applyBox_text2').html($('<option>', {
            text: '請選擇',
        }));

        if (!$(this).val()) $(this).val('請選擇');
        
        const type = $(this).val();

        if ($(this).val() === '請選擇') {
            $('.applyBox_btn').removeClass('active');
            return;
        }
        
        constants.type.find(function (o) {
            return o.type === type; 
        }).data.forEach(function (d) {
            $('.applyBox_text2').append($('<option>', {
                text: d.name,
            }));
        });
    });

    $('.applyBox_text2').on('change', function () {
        $(this).find(':selected').text() !== '請選擇'
            ? $('.applyBox_btn').addClass('active')
            : $('.applyBox_btn').removeClass('active');
    });

    // apply
    $('.applyBox_btn').on('click', function () {
        if (!$(this).hasClass('active')) return;
        var result = currentValue.data;
        var type =  $('.applyBox_text1').val();
        var name =  $('.applyBox_text2').val();
        var number = $('.applyBox_text3').val();
        currentValue.data.push({
            type,
            name,
            number,
        });
        console.log({
            type,
            name,
            number,
        });
        $('.resultBox2 table').append(`<tr><td>${name}</td><td>${number}</td></tr>`);
        createResult();
    });

    // add btn click event
    $('.selectList_optionBtn_btn').on('click', function () {
        $(this).parent().toggleClass('active');
    });

    $('.selectList_optionBtn_item').on('click', function () {
        switch ($(this).html()) {
            case '刪除項目':
                currentValue.resultRemoveMode = !currentValue.resultRemoveMode;
                $('.resultBox_btn_remove').toggleClass('active');
                if (currentValue.resultMode !== 'sum') createResult();
                break;
            case '清空資料':
                if (currentValue.resultMode === 'sum') {
                    currentValue.data = [];
                } else {
                    currentValue.data = currentValue.data.filter(function (d) {
                        return d.time !== currentValue.resultMode;
                    });
                }
                createResult();
                $('.resultBox2 table').empty();
                break;
        }
    });

    // remove result
    $('.resultBox_btn_remove').on('click', function () {
        if (currentValue.resultMode !== 'sum') {
            var removeSelect = [];
            $('.resultBox_textarea input').each(function () {
                if ($(this).prop('checked')) removeSelect.push(Number($(this).attr('data-id')));
            });
            removeSelect.sort(function (a, b) { return b - a; });
            removeSelect.forEach(function (index) {
                currentValue.data.splice(index, 1);
            });
            currentValue.resultRemoveMode = !currentValue.resultRemoveMode;
            $('.resultBox_btn_remove').toggleClass('active');
            createResult();
        }
    });
});
</script>
